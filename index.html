<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROL Ecosystem - NextGen Mining</title>
  
  <style>
    /* منع الوميض الأبيض */
    html, body {
      background-color: #020617 !important;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    :root {
      --bg: #020617;
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-border: rgba(56, 189, 248, 0.22);
      --cyan: #38bdf8;
      --cyan-bright: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* خلفية سيبرانية متطورة مع هالات نيون ضوئية */
    body {
      background: 
        radial-gradient(circle at 50% -10%, rgba(0, 240, 255, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 10% 45%, rgba(14, 165, 233, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 90% 70%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        #020617;
      background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 95px 16px;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      margin-bottom: 12px;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* محدد اللغات */
    .lang-select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 12px;
      outline: none;
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    .user-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    #ton-connect-btn {
      transform: scale(0.82);
      transform-origin: left center;
    }

    [dir="ltr"] #ton-connect-btn {
      transform-origin: right center;
    }

    .view-section {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.22s ease-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* بطاقة الرصيد الرقمية المتطورة */
    .balance-hud {
      position: relative;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.85), rgba(7, 13, 26, 0.75));
      backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px 20px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .balance-hud::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan-bright), transparent);
    }

    .balance-hud-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .balance-val {
      font-size: 40px;
      font-weight: 900;
      color: var(--cyan-bright);
      margin: 2px 0;
      text-shadow: 0 0 20px var(--cyan-glow);
      letter-spacing: -0.5px;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
    }

    .balance-val .unit {
      font-size: 16px;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: none;
    }

    /* منصة العملة */
    .mining-circle-wrapper {
      position: relative;
      width: 226px;
      height: 226px;
      margin: 10px 0 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mining-spinner {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--cyan-bright);
      border-right-color: var(--cyan);
      box-shadow: 0 0 25px var(--cyan-glow);
      animation: spin 3.5s linear infinite;
      display: none;
    }

    .mining-spinner.active {
      display: block;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .rol-coin {
      width: 216px;
      height: 216px;
      border-radius: 50%;
      border: 3px solid rgba(0, 240, 255, 0.6);
      background-image: url('IMG_20261029_212618_959.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-color: #030712;
      box-shadow: 0 0 35px rgba(0, 180, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.3);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mining-circle-wrapper:active .rol-coin {
      transform: scale(0.96);
    }

    /* شريط التعدين النقي والمطور بدون أي كتابات جانبية */
    .circuit-progress-card {
      width: 100%;
      background: rgba(10, 20, 38, 0.65);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .circuit-timer-display {
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 18px;
      font-weight: 800;
      color: var(--cyan-bright);
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, var(--cyan-bright));
      box-shadow: 0 0 12px var(--cyan-glow);
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    /* زر التعدين الاحترافي المختصر */
    .cta-btn {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }

    .cta-btn-start {
      background: linear-gradient(135deg, #0284c7 0%, #00f0ff 100%);
      color: #030712;
      box-shadow: 0 6px 25px rgba(0, 240, 255, 0.35);
    }

    .cta-btn-claim {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
    }

    .cta-btn-disabled {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* بطاقات بقية الأقسام */
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      margin-bottom: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .stat-box .val {
      font-size: 22px;
      font-weight: 900;
      color: var(--cyan-bright);
    }

    .stat-box .desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* شريط التنقل السفلي المتطور */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 74px;
      background: rgba(4, 9, 21, 0.94);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px 6px 16px;
      z-index: 100;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #64748b;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.22s ease;
      flex: 1;
      height: 100%;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      transition: all 0.22s ease;
    }

    .nav-tab.active {
      color: var(--cyan-bright);
    }

    .nav-tab.active .nav-icon {
      transform: translateY(-2px) scale(1.08);
      filter: drop-shadow(0 0 8px var(--cyan-bright));
    }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header>
    <div class="top-controls">
      <div class="user-pill" id="user-display">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--cyan)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span id="user-name-text">...</span>
      </div>
      <select id="lang-switch" class="lang-select">
        <option value="ar" selected>العربية</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>
    <div id="ton-connect-btn"></div>
  </header>

  <!-- تبويب 1: الرئيسية -->
  <main class="view-section active" id="tab-mining">
    <div class="balance-hud">
      <div class="balance-hud-label" data-i18n="withdrawable_balance">الرصيد المتاح للسحب</div>
      <div class="balance-val">
        <span id="balance">0.00</span>
        <span class="unit">ROL</span>
      </div>
    </div>

    <div class="mining-circle-wrapper">
      <div class="mining-spinner" id="spinner"></div>
      <div class="rol-coin"></div>
    </div>

    <!-- شريط التعدين النقي والمطور دون كتابات جانبية -->
    <div class="circuit-progress-card">
      <div class="circuit-timer-display" id="countdown">08:00:00</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <button class="cta-btn cta-btn-start" id="mine-action-btn">
      <span id="btn-text" data-i18n="btn_start">ابدأ</span>
    </button>
  </main>

  <!-- تبويب 2: الإحالات -->
  <section class="view-section" id="tab-frens">
    <div class="balance-hud">
      <div class="balance-hud-label" data-i18n="referral_earnings">أرباح الإحالات المكتسبة</div>
      <div class="balance-val">
        <span id="ref-earned">0.00</span>
        <span class="unit">ROL</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="val" id="ref-count">0</div>
        <div class="desc" data-i18n="invited_friends">الأصدقاء المدعوون</div>
      </div>
      <div class="stat-box">
        <div class="val">10%</div>
        <div class="desc" data-i18n="referral_bonus">نسبة الإنتاج</div>
      </div>
    </div>

    <button class="cta-btn cta-btn-start" id="share-ref-btn">
      <span data-i18n="invite_friend">دعوة الأصدقاء</span>
    </button>
  </section>

  <!-- تبويب 3: المحفظة -->
  <section class="view-section" id="tab-wallet">
    <div class="balance-hud">
      <div class="balance-hud-label" data-i18n="connected_wallet">عنوان المحفظة المتصلة</div>
      <div id="wallet-address-display" style="font-size: 14px; font-weight: 700; color: var(--cyan-bright); margin: 8px 0; word-break: break-all; font-family: monospace;">
        غير متصلة
      </div>
      <div style="font-size: 11px; color: var(--green); font-weight: 700;">TON MAINNET</div>
    </div>

    <div class="info-card">
      <div style="font-size: 14px; font-weight: 800; color: var(--cyan-bright); margin-bottom: 6px;" data-i18n="withdraw_title">سحب العملات</div>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;" data-i18n="withdraw_desc">الحد الأدنى للسحب هو 50 ROL. يتم تدقيق العمليات من الإدارة وحمايتها من الثغرات.</p>
      <button class="cta-btn cta-btn-disabled" id="request-withdraw-btn" style="padding: 12px; font-size: 13px;">
        <span data-i18n="withdraw_locked">السحب مقفل حالياً</span>
      </button>
    </div>
  </section>

  <!-- أزرار التنقل السفلية -->
  <nav class="bottom-nav">
    <div class="nav-tab active" data-tab="tab-mining">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span data-i18n="nav_main">الرئيسية</span>
    </div>
    <div class="nav-tab" data-tab="tab-frens">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      <span data-i18n="nav_frens">الإحالة</span>
    </div>
    <div class="nav-tab" data-tab="tab-wallet">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </svg>
      <span data-i18n="nav_wallet">المحفظة</span>
    </div>
  </nav>

  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js" defer></script>

  <script>
    // قاموس اللغات الثلاث
    const translations = {
      ar: {
        withdrawable_balance: "الرصيد المتاح للسحب",
        btn_start: "ابدأ",
        btn_mining: "جاري التعدين",
        btn_claim: "استلام",
        completed: "جاهز",
        referral_earnings: "أرباح الإحالات المكتسبة",
        invited_friends: "الأصدقاء المدعوون",
        referral_bonus: "نسبة الإنتاج",
        invite_friend: "دعوة الأصدقاء",
        connected_wallet: "عنوان المحفظة المتصلة",
        not_connected: "غير متصلة",
        withdraw_title: "سحب العملات",
        withdraw_desc: "الحد الأدنى للسحب هو 50 ROL. يتم تدقيق العمليات من الإدارة وحمايتها من الثغرات.",
        withdraw_locked: "السحب مقفل حالياً",
        nav_main: "الرئيسية",
        nav_frens: "الإحالة",
        nav_wallet: "المحفظة",
        claim_success: "تم استلام 50 ROL بنجاح!",
        ref_text: "انضم وابدأ تعدين عملة ROL كل 8 ساعات مجاناً!"
      },
      en: {
        withdrawable_balance: "Withdrawable Balance",
        btn_start: "START",
        btn_mining: "MINING",
        btn_claim: "CLAIM",
        completed: "READY",
        referral_earnings: "Referral Rewards",
        invited_friends: "Invited Friends",
        referral_bonus: "Production Share",
        invite_friend: "Invite Friends",
        connected_wallet: "Connected Wallet",
        not_connected: "Not Connected",
        withdraw_title: "Withdrawal",
        withdraw_desc: "Minimum withdrawal is 50 ROL. Transactions are verified and protected against exploits.",
        withdraw_locked: "Withdrawal Locked",
        nav_main: "Home",
        nav_frens: "Frens",
        nav_wallet: "Wallet",
        claim_success: "Successfully claimed 50 ROL!",
        ref_text: "Join and mine ROL every 8 hours for free!"
      },
      ru: {
        withdrawable_balance: "Доступно к выводу",
        btn_start: "НАЧАТЬ",
        btn_mining: "МАЙНИНГ",
        btn_claim: "ЗАБРАТЬ",
        completed: "ГОТОВО",
        referral_earnings: "Реферальные награды",
        invited_friends: "Приглашенные",
        referral_bonus: "Бонус добычи",
        invite_friend: "Пригласить друзей",
        connected_wallet: "Подключенный кошелек",
        not_connected: "Не подключен",
        withdraw_title: "Вывод средств",
        withdraw_desc: "Минимальный вывод: 50 ROL. Транзакции проверяются и защищены от уязвимостей.",
        withdraw_locked: "Вывод заблокирован",
        nav_main: "Главная",
        nav_frens: "Друзья",
        nav_wallet: "Кошелек",
        claim_success: "Успешно получено 50 ROL!",
        ref_text: "Присоединяйся и добывай ROL каждые 8 часов бесплатно!"
      }
    };

    let currentLang = localStorage.getItem('rol_app_lang') || 'ar';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('rol_app_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.getElementById('lang-switch').value = lang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      checkMiningState();
    }

    document.getElementById('lang-switch').addEventListener('change', (e) => {
      setLanguage(e.target.value);
    });

    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.initDataUnsafe?.user?.first_name) {
          document.getElementById('user-name-text').innerText = tg.initDataUnsafe.user.first_name;
        }
      } catch (e) {
        console.error("Telegram init:", e);
      }
    }

    let currentUserId = tg?.initDataUnsafe?.user?.id ? tg.initDataUnsafe.user.id.toString() : "miner";

    // التنقل بين التبويبات
    const navTabs = document.querySelectorAll('.nav-tab');
    const sections = document.querySelectorAll('.view-section');

    navTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        navTabs.forEach(t => t.classList.remove('active'));
        sections.forEach(s => s.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      });
    });

    // دورة التعدين كل 8 ساعات
    const CYCLE_DURATION = 8 * 60 * 60 * 1000;
    const CYCLE_REWARD = 50.0;

    let balance = parseFloat(localStorage.getItem('rol_balance') || '0');
    let miningStartTime = parseInt(localStorage.getItem('rol_mine_start') || '0', 10);
    let isMining = miningStartTime > 0;

    const balanceEl = document.getElementById('balance');
    const mineBtn = document.getElementById('mine-action-btn');
    const btnText = document.getElementById('btn-text');
    const countdownEl = document.getElementById('countdown');
    const progressBar = document.getElementById('progress-bar');
    const spinner = document.getElementById('spinner');

    function updateBalanceUI() {
      balanceEl.innerText = balance.toFixed(2);
      localStorage.setItem('rol_balance', balance.toString());
    }

    function checkMiningState() {
      const t = translations[currentLang];
      if (!isMining) {
        spinner.classList.remove('active');
        progressBar.style.width = '0%';
        countdownEl.innerText = '08:00:00';
        mineBtn.className = 'cta-btn cta-btn-start';
        btnText.innerText = t.btn_start;
        return;
      }

      const elapsed = Date.now() - miningStartTime;
      const remaining = Math.max(0, CYCLE_DURATION - elapsed);

      if (remaining > 0) {
        spinner.classList.add('active');
        const progressPct = ((elapsed / CYCLE_DURATION) * 100).toFixed(1);
        progressBar.style.width = Math.min(100, progressPct) + '%';

        const hours = Math.floor(remaining / (1000 * 60 * 60));
        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
        countdownEl.innerText = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        mineBtn.className = 'cta-btn cta-btn-disabled';
        btnText.innerText = t.btn_mining;
      } else {
        spinner.classList.remove('active');
        progressBar.style.width = '100%';
        countdownEl.innerText = t.completed;
        mineBtn.className = 'cta-btn cta-btn-claim';
        btnText.innerText = t.btn_claim;
      }
    }

    mineBtn.addEventListener('click', () => {
      const t = translations[currentLang];
      if (!isMining) {
        miningStartTime = Date.now();
        localStorage.setItem('rol_mine_start', miningStartTime.toString());
        isMining = true;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        checkMiningState();
      } else {
        const elapsed = Date.now() - miningStartTime;
        if (elapsed >= CYCLE_DURATION) {
          balance += CYCLE_REWARD;
          updateBalanceUI();
          isMining = false;
          miningStartTime = 0;
          localStorage.removeItem('rol_mine_start');
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          alert(t.claim_success);
          checkMiningState();
        }
      }
    });

    setInterval(checkMiningState, 1000);
    updateBalanceUI();
    setLanguage(currentLang);

    // مشاركة رابط الإحالة
    document.getElementById('share-ref-btn').onclick = () => {
      const t = translations[currentLang];
      const refLink = `https://t.me/ROL_Mining_bot?start=ref_${currentUserId}`;
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(t.ref_text)}`;
      tg?.openTelegramLink ? tg.openTelegramLink(shareUrl) : window.open(shareUrl, '_blank');
    };

    // ربط TonConnect الآمن على Mainnet
    window.addEventListener('load', () => {
      try {
        if (window.TON_CONNECT_UI) {
          const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test-manifest.json',
            buttonRootId: 'ton-connect-btn'
          });

          tonConnectUI.onStatusChange(wallet => {
            const addrEl = document.getElementById('wallet-address-display');
            const t = translations[currentLang];
            if (wallet && wallet.account) {
              if (wallet.account.chain && wallet.account.chain !== TON_CONNECT_UI.CHAIN.MAINNET) {
                tonConnectUI.disconnect();
                alert('Testnet rejected');
                addrEl.innerText = 'Testnet Blocked';
                return;
              }
              const addr = wallet.account.address;
              addrEl.innerText = `${addr.substring(0, 6)}...${addr.substring(addr.length - 6)}`;
            } else {
              addrEl.innerText = t.not_connected;
            }
          });
        }
      } catch (err) {
        console.warn("TonConnect UI safe fallback:", err);
      }
    });
  </script>
</body>
</html>
