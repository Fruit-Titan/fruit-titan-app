<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ROL Mining App</title>
  
  <!-- مكتبات تيليجرام و TON -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.4);
      --energy-color: #f59e0b;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at top, #1e293b 0%, #090d16 80%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    #ton-connect-btn {
      transform: scale(0.85);
      transform-origin: left center;
    }

    /* بطاقة الرصيد */
    .balance-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 14px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 4px 20px var(--cyan-glow);
      margin-bottom: 15px;
    }

    .balance-amount {
      font-size: 38px;
      font-weight: 800;
      color: var(--cyan);
      margin: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    /* العملة والنقر */
    .coin-container {
      position: relative;
      margin: 20px 0;
      cursor: pointer;
    }

    .coin {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid var(--cyan);
      box-shadow: 0 0 40px var(--cyan-glow), inset 0 0 20px var(--cyan-glow);
      background: url('https://i.postimg.cc/3RjLNYXC/1793303091528.jpg') center/cover no-repeat;
      transition: transform 0.06s ease;
    }

    .coin:active {
      transform: scale(0.92);
    }

    /* تأثير الرقم الطائر عند النقر */
    .tap-effect {
      position: absolute;
      color: var(--cyan);
      font-size: 26px;
      font-weight: 800;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
    }

    /* شريط الطاقة */
    .energy-container {
      width: 100%;
      max-width: 380px;
      margin-bottom: 16px;
    }

    .energy-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .energy-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    .energy-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 6px;
      transition: width 0.2s ease;
    }

    /* أزرار التنقل والعمليات */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-top: auto;
      padding-bottom: 10px;
    }

    .action-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 12px 8px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.96);
      border-color: var(--cyan);
    }

    /* نافذة منبثقة (Modal) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid var(--cyan);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--cyan);
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .task-btn {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .close-btn {
      margin-top: 15px;
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="user-badge" id="user-display">👤 منقّب ROL</div>
    <div id="ton-connect-btn"></div>
  </header>

  <div class="balance-card">
    <div style="font-size: 12px; color: var(--text-muted);">رصيد التعدين المتاح</div>
    <div class="balance-amount">
      <span id="balance">0</span>
      <span style="font-size: 20px;">ROL</span>
    </div>
    <div style="font-size: 12px; color: var(--cyan);">+<span id="mult">1</span> ROL لكل نقرة</div>
  </div>

  <div class="coin-container" id="coin-area">
    <div class="coin" id="coin"></div>
  </div>

  <div class="energy-container">
    <div class="energy-header">
      <span>⚡ الطاقة</span>
      <span><span id="energy-val">1000</span> / 1000</span>
    </div>
    <div class="energy-bar-bg">
      <div class="energy-bar-fill" id="energy-bar"></div>
    </div>
  </div>

  <div class="nav-grid">
    <button class="action-btn" id="tasks-btn">
      <span style="font-size: 18px;">📋</span>
      <span>المهام</span>
    </button>
    <button class="action-btn" id="frens-btn">
      <span style="font-size: 18px;">👥</span>
      <span>دعوة أصدقاء</span>
    </button>
    <button class="action-btn" id="withdraw-btn">
      <span style="font-size: 18px;">💎</span>
      <span>سحب ROL</span>
    </button>
  </div>

  <!-- نافذة المهام -->
  <div class="modal" id="tasks-modal">
    <div class="modal-content">
      <div class="modal-title">مهام كسب مكافآت ROL</div>
      <div class="task-item">
        <span>انضم لقناة التلجرام الرسمية</span>
        <button class="task-btn" onclick="completeTask(500)">+500</button>
      </div>
      <div class="task-item">
        <span>متابعة حساب المشروع على X</span>
        <button class="task-btn" onclick="completeTask(300)">+300</button>
      </div>
      <button class="close-btn" onclick="closeModal('tasks-modal')">إغلاق</button>
    </div>
  </div>

  <!-- نافذة الإحالة -->
  <div class="modal" id="frens-modal">
    <div class="modal-content">
      <div class="modal-title">برنامج الإحالة</div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
        احصل على **+1,000 ROL** لك ولصديقك عند انضمامه عبر رابطك الخاص!
      </p>
      <button class="task-btn" style="width: 100%; padding: 10px;" onclick="shareReferral()">
        🔗 نسخ رابط الإحالة ومشاركته
      </button>
      <button class="close-btn" onclick="closeModal('frens-modal')">إغلاق</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('user-display').innerText = '👤 ' + tg.initDataUnsafe.user.first_name;
      }
    }

    let balance = parseInt(localStorage.getItem('rol_pts') || '0', 10);
    let energy = parseInt(localStorage.getItem('rol_energy') || '1000', 10);
    const maxEnergy = 1000;
    const perTap = 1;

    const balanceEl = document.getElementById('balance');
    const energyValEl = document.getElementById('energy-val');
    const energyBarEl = document.getElementById('energy-bar');
    const coinArea = document.getElementById('coin-area');

    function updateStats() {
      balanceEl.innerText = balance.toLocaleString('en-US');
      energyValEl.innerText = energy;
      energyBarEl.style.width = (energy / maxEnergy * 100) + '%';
      localStorage.setItem('rol_pts', balance.toString());
      localStorage.setItem('rol_energy', energy.toString());
    }

    // استعادة الطاقة بمرور الوقت
    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 3);
        updateStats();
      }
    }, 1000);

    // النقر وحساب العملات
    coinArea.addEventListener('click', (e) => {
      if (energy < perTap) return;

      energy -= perTap;
      balance += perTap;
      updateStats();

      // اهتزاز الهاتف عبر Telegram Haptic API
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      // تأثير الرقم الطائر (+1)
      const rect = coinArea.getBoundingClientRect();
      const num = document.createElement('div');
      num.className = 'tap-effect';
      num.innerText = `+${perTap}`;
      num.style.left = `${e.clientX - rect.left - 10}px`;
      num.style.top = `${e.clientY - rect.top - 20}px`;
      coinArea.appendChild(num);

      setTimeout(() => num.remove(), 750);
    });

    // إدارة النوافذ المنبثقة
    document.getElementById('tasks-btn').onclick = () => document.getElementById('tasks-modal').style.display = 'flex';
    document.getElementById('frens-btn').onclick = () => document.getElementById('frens-modal').style.display = 'flex';

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function completeTask(reward) {
      balance += reward;
      updateStats();
      if (tg?.showAlert) {
        tg.showAlert(`🎉 مبروك! حصلت على ${reward} ROL إضافية!`);
      } else {
        alert(`🎉 مبروك! حصلت على ${reward} ROL إضافية!`);
      }
    }

    function shareReferral() {
      const botUsername = "ROL_Mining_bot";
      const userId = tg?.initDataUnsafe?.user?.id || "miner";
      const refUrl = `https://t.me/${botUsername}?start=ref_${userId}`;
      const shareText = `انضم معي وقم بتعدين عملة ROL مجاناً! 🚀`;
      const fullUrl = `https://t.me/share/url?url=${encodeURIComponent(refUrl)}&text=${encodeURIComponent(shareText)}`;
      
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(fullUrl);
      } else {
        window.open(fullUrl, '_blank');
      }
    }

    // محفظة TON
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test-manifest.json',
      buttonRootId: 'ton-connect-btn'
    });

    document.getElementById('withdraw-btn').onclick = () => {
      if (!tonConnectUI.account?.address) {
        const msg = "يرجى ربط محفظة TON أولاً من الزر في الأعلى لتتمكن من السحب.";
        tg?.showAlert ? tg.showAlert(msg) : alert(msg);
      } else {
        const msg = `طلب السحب قيد التطوير وسيتم فتحه عند انتهاء مرحلة التعدين الأولى!`;
        tg?.showAlert ? tg.showAlert(msg) : alert(msg);
      }
    };

    updateStats();
  </script>
</body>
</html>
