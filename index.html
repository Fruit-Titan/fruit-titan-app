<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROL Ecosystem - Mining Terminal</title>

  <style>
    /* تهيئة الشاشة ومنع الوميض الأبيض */
    html, body {
      background-color: #030a16 !important;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    :root {
      --bg-dark: #030a16;
      --card-bg: rgba(6, 17, 38, 0.75);
      --border-blue: rgba(0, 210, 255, 0.45);
      --neon-cyan: #00f0ff;
      --neon-blue: #0284c7;
      --gold-main: #f59e0b;
      --gold-light: #fbbf24;
      --gold-glow: rgba(245, 158, 11, 0.6);
      --green-live: #10b981;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* خلفية بيئة كهف التعدين النيون ثلاثية الأبعاد */
    body {
      background: 
        radial-gradient(circle at 50% 32%, rgba(0, 180, 255, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 10% 20%, rgba(0, 100, 255, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(0, 100, 255, 0.2) 0%, transparent 40%),
        repeating-linear-gradient(0deg, rgba(0, 240, 255, 0.02) 0px, rgba(0, 240, 255, 0.02) 1px, transparent 1px, transparent 24px),
        linear-gradient(180deg, #020712 0%, #030e20 40%, #020611 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px 85px 14px;
      min-height: 100vh;
    }

    /* الشريط العلوي */
    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      margin-bottom: 8px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-icon {
      width: 22px;
      height: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      cursor: pointer;
    }

    .menu-icon span {
      display: block;
      height: 2px;
      width: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
    }

    .verified-badge {
      width: 14px;
      height: 14px;
      fill: var(--neon-cyan);
    }

    .bot-tag {
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-btn {
      background: rgba(10, 25, 50, 0.7);
      border: 1px solid var(--border-blue);
      border-radius: 20px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .wallet-pill {
      background: rgba(10, 25, 50, 0.7);
      border: 1px solid var(--border-blue);
      border-radius: 20px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    /* منطقة مؤشرات VIP والمكافآت */
    .top-widgets {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 85px 1fr 85px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .vip-card {
      background: rgba(10, 25, 50, 0.6);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      padding: 6px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
    }

    .vip-crown {
      width: 18px;
      height: 18px;
      fill: var(--gold-main);
      filter: drop-shadow(0 0 4px var(--gold-glow));
    }

    .vip-title {
      font-size: 9px;
      color: var(--gold-light);
      font-weight: 700;
      margin-top: 2px;
    }

    .vip-badge {
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 1px;
    }

    .rate-card {
      background: rgba(5, 20, 45, 0.75);
      border: 1px solid var(--border-blue);
      border-radius: 14px;
      padding: 6px 8px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    }

    .rate-label {
      font-size: 10px;
      color: var(--neon-cyan);
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .rate-val {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 2px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .gift-card {
      background: rgba(10, 25, 50, 0.6);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 14px;
      padding: 6px 4px;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gift-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffffff;
    }

    .gift-icon {
      font-size: 16px;
    }

    .gift-label {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 2px;
    }

    /* كرت الرصيد الرقمي */
    .balance-terminal {
      width: 100%;
      max-width: 420px;
      background: rgba(4, 15, 35, 0.75);
      border: 1px solid var(--border-blue);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 10px 14px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
      margin-bottom: 12px;
    }

    .terminal-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .terminal-num {
      font-size: 34px;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.65);
      margin: 2px 0;
      font-family: ui-monospace, SFMono-Regular, monospace;
      letter-spacing: -0.5px;
    }

    /* منصة العملة ثلاثية الأبعاد مع قاعدة الشحن الذهبية */
    .podium-stage {
      position: relative;
      width: 240px;
      height: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 2px 0 14px 0;
    }

    .orbit-ring {
      position: absolute;
      width: 215px;
      height: 215px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--neon-cyan);
      border-bottom-color: var(--gold-main);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      animation: spinRing 6s linear infinite;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .coin-core {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid rgba(245, 158, 11, 0.7);
      background-image: url('IMG_20261029_212618_959.jpg');
      background-position: center;
      background-size: cover;
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.5), inset 0 0 20px rgba(245, 158, 11, 0.4);
      z-index: 2;
    }

    .podium-base {
      position: absolute;
      bottom: -6px;
      width: 190px;
      height: 26px;
      background: linear-gradient(180deg, #f59e0b 0%, #78350f 100%);
      border-radius: 50%;
      border: 2px solid #fbbf24;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
      z-index: 1;
    }

    /* شريط التعدين الحركي */
    .mine-track-box {
      width: 100%;
      max-width: 420px;
      background: rgba(4, 15, 35, 0.85);
      border: 1px solid var(--border-blue);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
      margin-bottom: 12px;
    }

    .track-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pickaxe-avatar {
      width: 32px;
      height: 32px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-title {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }

    .live-chip {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--green-live);
      color: #a7f3d0;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .time-stream {
      font-family: monospace;
      font-size: 22px;
      font-weight: 900;
      color: var(--gold-light);
      text-align: center;
      text-shadow: 0 0 10px var(--gold-glow);
      letter-spacing: 2px;
      margin: 4px 0;
    }

    .progress-trough {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .progress-laser {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, var(--neon-cyan));
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: width 0.3s ease;
    }

    /* شبكة بطاقات الأنشطة (المهام، الترقية) */
    .action-grid {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .action-card {
      background: rgba(6, 20, 45, 0.7);
      border: 1px solid var(--border-blue);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 150, 255, 0.15);
      cursor: pointer;
    }

    .action-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .action-h1 {
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
    }

    .action-sub {
      font-size: 10px;
      color: var(--neon-cyan);
      font-weight: 600;
    }

    .action-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* زر بدء التعدين الذهبي الفخم */
    .mine-execute-btn {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 50%, #f59e0b 100%);
      color: #000000;
      border: none;
      border-radius: 20px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 30px var(--gold-glow);
      cursor: pointer;
      font-weight: 900;
      transition: all 0.2s ease;
      margin-bottom: 14px;
    }

    .mine-execute-btn:active {
      transform: scale(0.98);
    }

    .btn-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .btn-main-txt {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .btn-sub-txt {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.85;
    }

    .btn-arrow {
      font-size: 18px;
      font-weight: 900;
    }

    /* شريط التنقل السفلي */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(2, 6, 16, 0.94);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 210, 255, 0.25);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px 4px 10px;
      z-index: 100;
    }

    .foot-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      flex: 1;
    }

    .foot-item.active {
      color: var(--gold-main);
    }

    .foot-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .foot-item.active .foot-icon {
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
</head>
<body>

  <!-- الرأس -->
  <header>
    <div class="brand-group">
      <div class="menu-icon">
        <span></span><span></span><span></span>
      </div>
      <div class="brand-title">
        <span class="brand-name">
          ROL 
          <svg class="verified-badge" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </span>
        <span class="bot-tag">@ROL_Miner_Bot</span>
      </div>
    </div>
    <div class="top-actions">
      <div class="lang-btn">
        <span>🇸🇦 AR</span>
      </div>
      <div class="wallet-pill" id="connect-wallet-btn">
        <span>Wallet</span>
      </div>
    </div>
  </header>

  <!-- بطاقات VIP ومعدل التعدين والهدية -->
  <section class="top-widgets">
    <div class="vip-card">
      <svg class="vip-crown" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-1h14v1z"/></svg>
      <span class="vip-title">المستوى الذهبي</span>
      <span class="vip-badge">VIP 1 &gt;</span>
    </div>

    <div class="rate-card">
      <div class="rate-label">
        <span>🚀</span> معدل التعدين الحالي
      </div>
      <div class="rate-val">+1.250 ROL <span style="font-size: 11px; font-weight: normal; color: var(--text-muted);">/ ساعة</span></div>
    </div>

    <div class="gift-card">
      <div class="gift-badge">3</div>
      <span class="gift-icon">🎁</span>
      <span class="gift-label">المكافآت اليومية</span>
    </div>
  </section>

  <!-- محطة الرصيد الرقمي -->
  <section class="balance-terminal">
    <div class="terminal-sub">
      <span>💳</span> رصيدك الحالي
    </div>
    <div class="terminal-num" id="balance-display">0.00 ROL</div>
  </section>

  <!-- منصة العملة ثلاثية الأبعاد -->
  <section class="podium-stage">
    <div class="orbit-ring"></div>
    <div class="coin-core"></div>
    <div class="podium-base"></div>
  </section>

  <!-- شريط تقدم التعدين -->
  <section class="mine-track-box">
    <div class="track-meta">
      <div class="track-left">
        <div class="pickaxe-avatar">
          <svg style="width: 18px; height: 18px; fill: var(--gold-main);" viewBox="0 0 100 100">
            <polygon points="20,86 14,80 54,40 60,46"/>
            <polygon points="51,43 59,35 67,43 59,51" fill="#fff"/>
            <path d="M26,24 C44,17 62,23 82,72 C79,53 72,40 59,35 C46,30 36,27 26,24 Z"/>
          </svg>

      </div>
    </div>
    <div class="time-stream" id="timer-val">08:00:00</div>
    <div class="progress-trough">
      <div class="progress-laser" id="progress-line"></div>
    </div>
  </section>

  <!-- شبكة الإجراءات (المهام، الترقية) -->
  <section class="action-grid">
    <div class="action-card">
      <div class="action-info">
        <span class="action-h1">المهام اليومية</span>
        <span class="action-sub">مكافآت إضافية</span>
      </div>
      <div class="action-icon-box">
        <svg style="width: 18px; height: 18px; fill: var(--neon-cyan);" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      </div>
    </div>

    <div class="action-card">
      <div class="action-info">
        <span class="action-h1">ترقية المستوى</span>
        <span class="action-sub">مزايا أكبر</span>
      </div>
      <div class="action-icon-box">
        <svg style="width: 18px; height: 18px; fill: var(--neon-cyan);" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      </div>
    </div>
  </section>

  <!-- زر بدء التعدين الذهبي -->
  <button class="mine-execute-btn" id="start-mine-btn">
    <svg style="width: 26px; height: 26px; fill: #000;" viewBox="0 0 100 100">
      <polygon points="20,86 14,80 54,40 60,46"/>
      <polygon points="51,43 59,35 67,43 59,51" fill="#fff"/>
      <path d="M26,24 C44,17 62,23 82,72 C79,53 72,40 59,35 C46,30 36,27 26,24 Z"/>
    </svg>
    <div class="btn-center">
      <span class="btn-main-txt" id="mine-btn-title">بدء التعدين الآن</span>
      <span class="btn-sub-txt">اضغط لزيادة رصيدك</span>
    </div>
    <span class="btn-arrow">&gt;&gt;</span>
  </button>

  <!-- شريط التنقل السفلي -->
  <footer class="footer-bar">
    <div class="foot-item active">
      <svg class="foot-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>الرئيسية</span>
    </div>

      <span>المكافآت</span>
    </div>
    <div class="foot-item">
      <svg class="foot-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>الإحالات</span>
    </div>
    <div class="foot-item">
      <svg class="foot-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span>الإعدادات</span>
    </div>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {
        console.error("TG Init:", e);
      }
    }

    const uid = tg?.initDataUnsafe?.user?.id ? tg.initDataUnsafe.user.id.toString() : "pilot";
    const KEY_BALANCE = `rol_v3_${uid}_bal`;
    const KEY_START = `rol_v3_${uid}_start`;

    const CYCLE = 8 * 60 * 60 * 1000;
    const REWARD = 50.0;

    let balance = parseFloat(localStorage.getItem(KEY_BALANCE) || '0');
    let startTime = parseInt(localStorage.getItem(KEY_START) || '0', 10);
    let isMining = startTime > 0;
    let lock = false;

    const balanceDisplay = document.getElementById('balance-display');
    const timerVal = document.getElementById('timer-val');
    const progressLine = document.getElementById('progress-line');
    const mineBtn = document.getElementById('start-mine-btn');
    const mineBtnTitle = document.getElementById('mine-btn-title');
    const trackStatusTxt = document.getElementById('track-status-txt');

    function updateBalance() {
      balanceDisplay.innerText = balance.toFixed(2) + " ROL";
      localStorage.setItem(KEY_BALANCE, balance.toString());
    }

    function renderEngine() {
      if (!isMining) {
        progressLine.style.width = '0%';
        timerVal.innerText = '08:00:00';
        trackStatusTxt.innerText = 'التعدين جاهز';
        mineBtnTitle.innerText = 'بدء التعدين الآن';
        return;
      }

      const now = Date.now();
      const elapsed = now - startTime;
      const left = Math.max(0, CYCLE - elapsed);

      if (left > 0) {
        const pct = Math.min(100, (elapsed / CYCLE) * 100).toFixed(1);
        progressLine.style.width = pct + '%';

        const h = Math.floor(left / (1000 * 60 * 60));
        const m = Math.floor((left % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((left % (1000 * 60)) / 1000);
        timerVal.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        trackStatusTxt.innerText = 'التعدين مستمر...';
        mineBtnTitle.innerText = 'جاري التعدين...';
      } else {
        progressLine.style.width = '100%';
        timerVal.innerText = 'جاهز للحصاد!';
        trackStatusTxt.innerText = 'اكتملت الدورة';
        mineBtnTitle.innerText = 'استلام المكافأة (+50 ROL)';
      }
    }

    mineBtn.addEventListener('click', () => {
      if (!isMining) {
        startTime = Date.now();
        localStorage.setItem(KEY_START, startTime.toString());
        isMining = true;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        renderEngine();
      } else {
        const elapsed = Date.now() - startTime;
        if (elapsed >= CYCLE) {
          if (lock) return;
          lock = true;
          balance += REWARD;
          updateBalance();
          isMining = false;
          startTime = 0;
          localStorage.removeItem(KEY_START);
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          alert('🎉 تم استلام 50 ROL بنجاح!');
          renderEngine();
          lock = false;
        }
      }
    });

    setInterval(renderEngine, 1000);
    updateBalance();
    renderEngine();

    // تشغيل TonConnect
    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.TON_CONNECT_UI) {
          const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json',
            buttonRootId: 'connect-wallet-btn',
            uiPreferences: { theme: TON_CONNECT_UI.THEME.DARK },
            actionsConfiguration: { twaReturnUrl: 'https://t.me/ROL_Miner_Bot' }
          });
        }
      } catch (e) {
        console.warn("Wallet fallback active");
      }
    });
  </script>
</body>
</html>
